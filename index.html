<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sovereign SI Case Map</title>
<meta name="description" content="An investigative case board of the sovereign SI buildout: master systems, companies, contracts, capital, threats and investable exposure.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&family=Albert+Sans:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<script src="data/case.js"></script>
<script src="data/market.js"></script>
</head>
<body class="v-map">
<header id="top">
  <div class="brand">
    <div class="brand-title">SOVEREIGN SI <b>//</b> CASE MAP</div>
  </div>
  <nav id="nav" aria-label="Views">
    <button type="button" data-view="map" aria-current="page">MAP</button>
    <button type="button" data-view="threads">THREADS</button>
    <button type="button" data-view="players">PLAYERS</button>
    <button type="button" data-view="playbook">PLAYBOOK</button>
    <button type="button" data-view="markets">MARKETS</button>
    <button type="button" data-view="brief">BRIEF</button>
    <button type="button" data-view="sources">SOURCES</button>
  </nav>
  <div class="search">
    <label for="q" class="sr">Search nodes, tickers and threads</label>
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M9.5 9.5L13 13" stroke="currentColor" stroke-width="1.4"/></svg>
    <input id="q" type="search" placeholder="Find company or ticker" autocomplete="off">
  </div>
</header>

<main id="stage" aria-label="Case map">
  <aside id="rail" aria-label="Map controls"></aside>
  <section id="main">
    <div id="bar" role="status"></div>
    <div id="board-wrap">
      <div id="board"></div>
      <div id="subject" hidden></div>
    </div>
  </section>
  <aside id="dossier" aria-label="Node dossier" hidden></aside>
</main>

<section class="sheet" id="sheet-threads" aria-label="Investigation threads"></section>
<section class="sheet" id="sheet-players" aria-label="Key players"></section>
<section class="sheet" id="sheet-playbook" aria-label="Playbook"></section>
<section class="sheet" id="sheet-markets" aria-label="Markets"></section>
<section class="sheet" id="sheet-brief" aria-label="Brief"></section>
<section class="sheet" id="sheet-sources" aria-label="Sources"></section>

<script type="module" src="assets/app.js"></script>
</body>
</html>
