name: Refresh market data

# Reruns pipeline/build_market.py and commits data/market.js.
# Cron runs in UTC: 12:00 UTC = 7:00 AM EST (8:00 AM EDT); 00:00 UTC = 7:00 PM EST (8:00 PM EDT).
on:
  schedule:
    - cron: "0 12 * * 1-5"
    - cron: "0 0 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build market data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python pipeline/build_market.py
      - name: Commit if changed
        run: |
          git config user.name "casemap-bot"
          git config user.email "casemap-bot@users.noreply.github.com"
          git add data/market.js
          git diff --staged --quiet || git commit -m "Refresh market data"
          git push
